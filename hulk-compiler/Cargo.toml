[package]
name = "hulk-compiler"
version = "0.1.0"
edition = "2024"

[dependencies]

[dependencies.inkwell]
version = "0.9.0"
features = ["llvm16-0", "llvm16-0-prefer-dynamic"]
optional = true

[features]
# Enable LLVM-based verification (requires system LLVM and the `inkwell` crate)
llvm-verify = ["inkwell"]
